# ---------------------------------------------------------------------------
# Port 80 only. Use this ONCE, to get the certificate.
#
# The real config (deploy/nginx.conf) names certificate files under
# /etc/letsencrypt/live/pravah.ashikagroup.com/. Until those files exist,
# `nginx -t` fails and nginx will not start — so you cannot install the real
# config first and then ask certbot to use it. This is the chicken-and-egg that
# makes a TLS bootstrap look harder than it is.
#
# Order:
#   1. install THIS file, reload nginx          (port 80 answers, HTTP only)
#   2. certbot certonly --webroot               (certificate is written)
#   3. install deploy/nginx.conf, reload        (443 works, 80 redirects)
#
# deploy/ssl-setup.sh does all three in order and stops at the first failure.
# ---------------------------------------------------------------------------

upstream vendor_wrapper_boot {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name pravah.ashikagroup.com 20.244.33.142 _;

    # Let's Encrypt writes its challenge file here and fetches it over plain
    # HTTP. This location must stay reachable without TLS, which is why the
    # real config keeps it too — renewals use the same path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # While we are without a certificate the app still has to be usable, so
    # this proxies rather than redirecting. deploy/nginx.conf replaces it with
    # a 301 the moment the certificate is in place.
    location / {
        proxy_pass http://vendor_wrapper_boot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
