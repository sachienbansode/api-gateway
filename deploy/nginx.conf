# ---------------------------------------------------------------------------
# nginx front door for Pravah — the Ashika API Gateway.
#
# Place at /etc/nginx/sites-available/api-gateway and symlink into
# sites-enabled. nginx terminates TLS; the Node process listens only on
# 127.0.0.1:8080 and is not reachable from the network directly.
#
# Get the certificate with:
#   sudo certbot --nginx -d pravah.ashikagroup.com
# ---------------------------------------------------------------------------

# Defence in depth: the app rate limits per API key, nginx rate limits per IP.
# The nginx layer is what absorbs a flood from a broken vendor retry loop before
# it ever costs you a Node event-loop tick.
limit_req_zone $binary_remote_addr zone=vendor_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=vendor_conn:10m;

# The login form is a password-guessing surface, so it gets a much tighter
# bucket than the vendor API. The app limits attempts too; this stops the
# flood before it costs a bcrypt comparison.
limit_req_zone $binary_remote_addr zone=admin_ip:10m rate=2r/s;

upstream vendor_wrapper {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    # IPv6 is commented out because nginx REFUSES TO START if the kernel has no
    # IPv6 ("Address family not supported by protocol") — a total outage over a
    # protocol you may not be using. Uncomment once you have IPv6 configured.
    # listen [::]:80;
    server_name pravah.ashikagroup.com;

    # ACME challenge must stay on HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # `http2 on;` is nginx 1.25+. Ubuntu 24.04 ships 1.24, where HTTP/2 is
    # enabled on the listen directive instead. This form works on both.
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;   # see the note above
    server_name pravah.ashikagroup.com;

    ssl_certificate     /etc/letsencrypt/live/pravah.ashikagroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pravah.ashikagroup.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Do not advertise the nginx version to the vendor.
    server_tokens off;

    # Matches the app's 64kb body cap, so an oversized body is refused at the
    # edge rather than buffered into Node.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/pravah-access.log;
    error_log  /var/log/nginx/pravah-error.log warn;

    # -----------------------------------------------------------------------
    # Health endpoints are unauthenticated, so do not expose them publicly.
    # Keep them for your own monitoring from inside the VNet.
    # -----------------------------------------------------------------------
    location ~ ^/(healthz|readyz)$ {
        allow 10.0.0.0/8;       # your VNet
        allow 127.0.0.1;
        deny all;
        proxy_pass http://vendor_wrapper;
    }


    # -----------------------------------------------------------------------
    # Admin UI — YOUR staff, not the vendor.
    #
    # This is the one location that must NOT be reachable from the internet.
    # It can change which fields every vendor sees, so the IP allowlist is the
    # control that matters; the password is the second line, not the first.
    #
    # Replace the placeholder with your office / VPN egress IPs. Until you do,
    # `deny all` means nobody reaches it — including you. That is the safe
    # default: an admin panel open by accident is worse than one closed by
    # accident.
    # -----------------------------------------------------------------------
    location /admin {
        # allow 203.0.113.5;        # office
        # allow 203.0.113.6;        # VPN egress
        deny all;

        limit_req zone=admin_ip burst=10 nodelay;

        proxy_pass http://vendor_wrapper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    location / {
        limit_req zone=vendor_ip burst=40 nodelay;
        limit_conn vendor_conn 20;

        # ---------------------------------------------------------------
        # Optional but recommended: pin to the vendor's egress IPs. A leaked
        # API key is then useless from anywhere else. Uncomment and fill in.
        # ---------------------------------------------------------------
        # allow 203.0.113.10;
        # allow 203.0.113.11;
        # deny all;

        proxy_pass http://vendor_wrapper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # Never let an upstream error page from nginx or Node reach the vendor
        # with internal detail in it.
        proxy_intercept_errors off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
