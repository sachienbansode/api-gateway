# ---------------------------------------------------------------------------
# nginx front door for Pravah — the Ashika API Gateway.
#
# Place at /etc/nginx/sites-available/api-gateway and symlink into
# sites-enabled. nginx terminates TLS; the Node process listens only on
# 127.0.0.1:8080 and is not reachable from the network directly.
#
# Get the certificate with:
#   sudo certbot --nginx -d pravah.ashikagroup.com
# ---------------------------------------------------------------------------

# Defence in depth: the app rate limits per API key, nginx rate limits per IP.
# The nginx layer is what absorbs a flood from a broken vendor retry loop before
# it ever costs you a Node event-loop tick.
limit_req_zone $binary_remote_addr zone=vendor_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=vendor_conn:10m;

# The login form is a password-guessing surface, so it gets a much tighter
# bucket than the vendor API. The app limits attempts too; this stops the
# flood before it costs a bcrypt comparison.
limit_req_zone $binary_remote_addr zone=admin_ip:10m rate=2r/s;

upstream vendor_wrapper {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    # IPv6 is ON for this server — nginx is already listening on [::]:80 and
    # [::]:443 for the other application. We have to listen there too, and not
    # for symmetry: if another block holds [::]:443 as default_server and we do
    # not claim our name on IPv6, an IPv6 client asking for this host reaches
    # THAT application instead. A vendor on an IPv6 network would be served
    # someone else's site.
    #
    # If this is ever deployed to a machine with no IPv6, nginx refuses to
    # start with "Address family not supported by protocol". Comment both
    # [::] lines out there — ssl-setup.sh reports what the machine has before
    # it changes anything.
    listen [::]:80;
    server_name pravah.ashikagroup.com;

    # -----------------------------------------------------------------------
    # HTTP is REFUSED, not redirected.
    #
    # A redirect looks friendlier and is wrong for an API. By the time we could
    # send a 301, the vendor has already put their API key on the wire in
    # plaintext — the redirect does not undo that, it teaches their client that
    # starting on http is fine, and it will do it again tomorrow. Refusing
    # makes the mistake visible on the first call, while it is still a
    # development problem rather than a leaked credential.
    #
    # Browsers reaching the console get the same refusal with a readable line;
    # the HSTS header on the TLS side means a browser that has been here once
    # will not try http again at all.
    # -----------------------------------------------------------------------

    # The ONE exception, and it has to stay: Let's Encrypt validates over plain
    # HTTP on port 80. Block this and renewal stops working — which is how a
    # certificate quietly expires 60 days later. Nothing of the application is
    # reachable here; it serves one short random filename that certbot writes.
    location /.well-known/acme-challenge/ {
        root /var/www/pravah-acme;
        default_type "text/plain";
    }

    location / {
        default_type text/plain;
        return 403 "This API is HTTPS only. Use https://$host$request_uri\n";
    }
}

server {
    # `http2 on;` is nginx 1.25+. Ubuntu 24.04 ships 1.24, where HTTP/2 is
    # enabled on the listen directive instead. This form works on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;   # see the note on the HTTP block above
    server_name pravah.ashikagroup.com;

    ssl_certificate     /etc/letsencrypt/live/pravah.ashikagroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pravah.ashikagroup.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling is deliberately NOT enabled: Let's Encrypt stopped putting
    # an OCSP responder URL in its certificates in 2025, so these directives
    # do nothing except print a warning on every reload. Revocation checking
    # for these certificates is handled by their short lifetime instead.
    # ssl_stapling on;
    # ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Do not advertise the nginx version to the vendor.
    server_tokens off;

    # Matches the app's 64kb body cap, so an oversized body is refused at the
    # edge rather than buffered into Node.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/pravah-access.log;
    error_log  /var/log/nginx/pravah-error.log warn;

    # -----------------------------------------------------------------------
    # Health endpoints are unauthenticated, so do not expose them publicly.
    # Keep them for your own monitoring from inside the VNet.
    # -----------------------------------------------------------------------
    location ~ ^/(healthz|readyz)$ {
        allow 10.0.0.0/8;       # your VNet
        allow 127.0.0.1;
        deny all;
        proxy_pass http://vendor_wrapper;
    }


    # -----------------------------------------------------------------------
    # Admin console.
    #
    # No IP allowlist here: access control is a product feature, held per
    # vendor in the database and managed from the console itself. What nginx
    # still does is throttle the login form far harder than the vendor API,
    # so password guessing is stopped at the edge rather than costing a bcrypt
    # comparison per attempt.
    #
    # ⚠ This means the console is reachable from anywhere the DNS resolves.
    #    Its defences are the login, the 10-attempts-per-15-minutes limiter,
    #    and live revocation from the platform directory. If you ever want a
    #    network-level gate as well, add `allow <ip>; deny all;` here.
    # -----------------------------------------------------------------------
    location /admin {
        limit_req zone=admin_ip burst=10 nodelay;

        proxy_pass http://vendor_wrapper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;

        proxy_hide_header X-Powered-By;
        # The app sets its own HSTS; nginx terminates TLS and owns that header,
        # so hide the duplicate rather than sending two of them.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Server;
    }

    location / {
        limit_req zone=vendor_ip burst=40 nodelay;
        limit_conn vendor_conn 20;

        # Per-vendor IP allowlists live in the database and are enforced by
        # the application, so one vendor can be pinned without affecting
        # another. Add nginx-level `allow`/`deny` here only if you want a
        # blanket restriction across every vendor as well.

        proxy_pass http://vendor_wrapper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # Never let an upstream error page from nginx or Node reach the vendor
        # with internal detail in it.
        proxy_intercept_errors off;
        proxy_hide_header X-Powered-By;
        # The app sets its own HSTS; nginx terminates TLS and owns that header,
        # so hide the duplicate rather than sending two of them.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Server;
    }
}
