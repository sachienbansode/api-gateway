# ---------------------------------------------------------------------------
# nginx front door for the vendor API wrapper.
#
# Place at /etc/nginx/sites-available/vendor-api-wrapper and symlink into
# sites-enabled. nginx terminates TLS; the Node process listens only on
# 127.0.0.1:8080 and is not reachable from the network directly.
#
# Get the certificate with:
#   sudo certbot --nginx -d partner-api.yourdomain.com
# ---------------------------------------------------------------------------

# Defence in depth: the app rate limits per API key, nginx rate limits per IP.
# The nginx layer is what absorbs a flood from a broken vendor retry loop before
# it ever costs you a Node event-loop tick.
limit_req_zone $binary_remote_addr zone=vendor_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=vendor_conn:10m;

upstream vendor_wrapper {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name partner-api.yourdomain.com;

    # ACME challenge must stay on HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name partner-api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/partner-api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner-api.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Do not advertise the nginx version to the vendor.
    server_tokens off;

    # Matches the app's 64kb body cap, so an oversized body is refused at the
    # edge rather than buffered into Node.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/vendor-api-access.log;
    error_log  /var/log/nginx/vendor-api-error.log warn;

    # -----------------------------------------------------------------------
    # Health endpoints are unauthenticated, so do not expose them publicly.
    # Keep them for your own monitoring from inside the VNet.
    # -----------------------------------------------------------------------
    location ~ ^/(healthz|readyz)$ {
        allow 10.0.0.0/8;       # your VNet
        allow 127.0.0.1;
        deny all;
        proxy_pass http://vendor_wrapper;
    }

    location / {
        limit_req zone=vendor_ip burst=40 nodelay;
        limit_conn vendor_conn 20;

        # ---------------------------------------------------------------
        # Optional but recommended: pin to the vendor's egress IPs. A leaked
        # API key is then useless from anywhere else. Uncomment and fill in.
        # ---------------------------------------------------------------
        # allow 203.0.113.10;
        # allow 203.0.113.11;
        # deny all;

        proxy_pass http://vendor_wrapper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        # Never let an upstream error page from nginx or Node reach the vendor
        # with internal detail in it.
        proxy_intercept_errors off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }
}
